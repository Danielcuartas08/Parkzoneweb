# CONFIGURACI\u00d3N DE CONEXI\u00d3N A MYSQL #
spring.datasource.url=jdbc:mysql://localhost:3306/mydb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=0000

# CONFIGURACI\u00d3N DE RUTA DE LA APLICACI\u00d3N #
server.servlet.context-path=/Parkzone

# PROPIEDADES DE JPA / HIBERNATE #
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# CONFIGURACI\u00d3N DE VISTAS (JSP) #
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp